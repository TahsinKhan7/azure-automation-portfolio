# =============================================================================
# dataplatform-cd : promote the Python wheel + notebooks through every environment
# -----------------------------------------------------------------------------
# Triggered by a successful dataplatform-ci run on main. One stage per entry in
# the `environments` parameter is generated with a template loop, so adding an
# environment is a one-line change. Each stage targets an Azure DevOps
# Environment named dataplatform-<env>; approvals and checks (manual approval,
# business hours, required reviewers) are configured on those Environments.
#
# Authentication: an Azure Resource Manager service connection using workload
# identity federation per environment. The Databricks CLI authenticates with
# DATABRICKS_AUTH_TYPE=azure-cli, so no PAT is ever created or stored.
# =============================================================================
name: cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: dataplatform-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: environments
    displayName: Promotion path (in order)
    type: object
    default:
      - name: dev
        serviceConnection: sc-dataplatform-dev
        dependsOn: []
      - name: ite
        serviceConnection: sc-dataplatform-ite
        dependsOn: [Deploy_dev]
      - name: iqe
        serviceConnection: sc-dataplatform-iqe
        dependsOn: [Deploy_ite]
      - name: preprod
        serviceConnection: sc-dataplatform-preprod
        dependsOn: [Deploy_iqe]
      - name: prod
        serviceConnection: sc-dataplatform-prod
        dependsOn: [Deploy_preprod]
  - name: runSmokeTest
    displayName: Run the smoke-test job after each deployment
    type: boolean
    default: true

variables:
  - name: artifactName
    value: dataplatform-python
  - name: artifactRoot
    value: $(Pipeline.Workspace)/ci/$(artifactName)

stages:
  - ${{ each env in parameters.environments }}:
      - stage: Deploy_${{ env.name }}
        displayName: Deploy to ${{ env.name }}
        dependsOn: ${{ env.dependsOn }}
        # Only artefacts built from main are promoted; a manual run of a feature build stops here.
        condition: and(succeeded(), eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/main'))
        variables:
          # Variable group per environment: databricksHost, wheelVolumePath,
          # notebookWorkspaceRoot, smokeTestJobName (see README.md).
          - group: dataplatform-${{ env.name }}
        jobs:
          - deployment: Deploy
            displayName: Databricks ${{ env.name }}
            environment: dataplatform-${{ env.name }}
            timeoutInMinutes: 30
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      fetchDepth: 1

                    - download: ci
                      artifact: $(artifactName)
                      displayName: Download build artefact

                    - bash: |
                        set -euo pipefail
                        echo "Artefact contents:"
                        find "$(artifactRoot)" -type f | sed 's#^#  #'
                        wheel=$(find "$(artifactRoot)/wheel" -name '*.whl' | head -n 1)
                        if [ -z "$wheel" ]; then
                          echo "##vso[task.logissue type=error]No wheel found in artefact $(artifactName)"
                          exit 1
                        fi
                        echo "##vso[task.setvariable variable=wheelPath]${wheel}"
                        echo "##vso[task.setvariable variable=wheelName]$(basename "$wheel")"
                        cat "$(artifactRoot)/build-info.json"
                      displayName: Inspect artefact

                    - bash: scripts/ci/install-databricks-cli.sh
                      displayName: Install Databricks CLI (pinned, checksum verified)

                    - task: AzureCLI@2
                      displayName: Upload wheel to Unity Catalog volume
                      inputs:
                        azureSubscription: ${{ env.serviceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        inlineScript: |
                          set -euo pipefail
                          export DATABRICKS_HOST="$(databricksHost)"
                          export DATABRICKS_AUTH_TYPE=azure-cli
                          databricks current-user me --output json | jq -r '"Authenticated as " + .userName'

                          # wheelVolumePath is a Unity Catalog volume path such as
                          # /Volumes/dataplatform_dev/platform/artifacts; the CLI addresses it via dbfs:/Volumes/...
                          folder="$(wheelVolumePath)/$(Build.BuildNumber)"
                          databricks fs mkdir "dbfs:${folder}"
                          databricks fs cp --overwrite "$(wheelPath)" "dbfs:${folder}/$(wheelName)"
                          databricks fs ls "dbfs:${folder}"
                          echo "##vso[task.setvariable variable=deployedWheel]${folder}/$(wheelName)"

                    - task: AzureCLI@2
                      displayName: Import notebooks into workspace
                      condition: and(succeeded(), ne(variables['notebookWorkspaceRoot'], ''))
                      inputs:
                        azureSubscription: ${{ env.serviceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        inlineScript: |
                          set -euo pipefail
                          export DATABRICKS_HOST="$(databricksHost)"
                          export DATABRICKS_AUTH_TYPE=azure-cli
                          src="$(artifactRoot)/notebooks"
                          if [ ! -d "$src" ]; then
                            echo "No notebooks folder in artefact; skipping import."
                            exit 0
                          fi
                          databricks workspace mkdirs "$(notebookWorkspaceRoot)"
                          databricks workspace import-dir --overwrite "$src" "$(notebookWorkspaceRoot)"
                          databricks workspace list "$(notebookWorkspaceRoot)"

                    - ${{ if eq(parameters.runSmokeTest, true) }}:
                        - task: AzureCLI@2
                          displayName: Smoke test (run $(smokeTestJobName))
                          condition: and(succeeded(), ne(variables['smokeTestJobName'], ''))
                          inputs:
                            azureSubscription: ${{ env.serviceConnection }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            addSpnToEnvironment: true
                            inlineScript: |
                              set -euo pipefail
                              export DATABRICKS_HOST="$(databricksHost)"
                              export DATABRICKS_AUTH_TYPE=azure-cli
                              job_id=$(databricks jobs list --name "$(smokeTestJobName)" --output json | jq -r '.[0].job_id // empty')
                              if [ -z "$job_id" ]; then
                                echo "##vso[task.logissue type=error]Job '$(smokeTestJobName)' not found in $(databricksHost)"
                                exit 1
                              fi
                              echo "Running job ${job_id} with wheel $(deployedWheel)"
                              databricks jobs run-now "$job_id" \
                                --json "{\"job_parameters\": {\"wheel_path\": \"$(deployedWheel)\"}}" \
                                --timeout 20m

                    - bash: |
                        set -euo pipefail
                        {
                          echo "## Deployed to ${{ env.name }}"
                          echo
                          echo "- Wheel: \`$(deployedWheel)\`"
                          echo "- Source: $(Build.SourceVersion) (run $(Build.BuildNumber))"
                        } > "$(Agent.TempDirectory)/summary-${{ env.name }}.md"
                        echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/summary-${{ env.name }}.md"
                      displayName: Deployment summary
