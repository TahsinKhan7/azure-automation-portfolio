# =============================================================================
# dataplatform-databricks-redeploy : targeted redeploy / rollback (manual only)
# -----------------------------------------------------------------------------
# cd-pipeline.yml is the normal promotion path. This pipeline is for operations:
# push a *specific* dataplatform-ci build (chosen in the "Resources" picker when
# queuing the run) to a *single* environment, for example to roll production
# back to the previous wheel. It reuses the same Environment approvals.
# =============================================================================
name: dbx-redeploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: dataplatform-ci
      # No trigger: the run (and therefore the wheel version) is chosen manually.

pool:
  vmImage: ubuntu-latest

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, ite, iqe, preprod, prod]
  - name: reason
    displayName: Reason (recorded in the run summary, e.g. "rollback INC-1234")
    type: string
    default: not specified
  - name: importNotebooks
    displayName: Also re-import notebooks from the chosen build
    type: boolean
    default: true

variables:
  - group: dataplatform-${{ parameters.environment }}
  - name: artifactName
    value: dataplatform-python
  - name: artifactRoot
    value: $(Pipeline.Workspace)/ci/$(artifactName)
  - name: serviceConnection
    value: sc-dataplatform-${{ parameters.environment }}

stages:
  - stage: Redeploy
    displayName: Redeploy to ${{ parameters.environment }}
    jobs:
      - deployment: Redeploy
        displayName: Databricks ${{ parameters.environment }}
        environment: dataplatform-${{ parameters.environment }}
        timeoutInMinutes: 30
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - download: ci
                  artifact: $(artifactName)
                  displayName: Download chosen build

                - bash: |
                    set -euo pipefail
                    echo "Selected build: $(resources.pipeline.ci.runName)"
                    echo "  run id: $(resources.pipeline.ci.runID)  commit: $(resources.pipeline.ci.sourceCommit)"
                    cat "$(artifactRoot)/build-info.json"
                    wheel=$(find "$(artifactRoot)/wheel" -name '*.whl' | head -n 1)
                    [ -n "$wheel" ] || { echo "##vso[task.logissue type=error]No wheel in artefact"; exit 1; }
                    echo "##vso[task.setvariable variable=wheelPath]${wheel}"
                    echo "##vso[task.setvariable variable=wheelName]$(basename "$wheel")"
                  displayName: Inspect artefact

                - bash: scripts/ci/install-databricks-cli.sh
                  displayName: Install Databricks CLI (pinned, checksum verified)

                - task: AzureCLI@2
                  displayName: Upload wheel
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export DATABRICKS_HOST="$(databricksHost)"
                      export DATABRICKS_AUTH_TYPE=azure-cli
                      folder="$(wheelVolumePath)/$(resources.pipeline.ci.runName)"
                      databricks fs mkdir "dbfs:${folder}"
                      databricks fs cp --overwrite "$(wheelPath)" "dbfs:${folder}/$(wheelName)"
                      databricks fs ls "dbfs:${folder}"
                      echo "##vso[task.setvariable variable=deployedWheel]${folder}/$(wheelName)"

                - ${{ if eq(parameters.importNotebooks, true) }}:
                    - task: AzureCLI@2
                      displayName: Re-import notebooks
                      condition: and(succeeded(), ne(variables['notebookWorkspaceRoot'], ''))
                      inputs:
                        azureSubscription: $(serviceConnection)
                        scriptType: bash
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        inlineScript: |
                          set -euo pipefail
                          export DATABRICKS_HOST="$(databricksHost)"
                          export DATABRICKS_AUTH_TYPE=azure-cli
                          src="$(artifactRoot)/notebooks"
                          [ -d "$src" ] || { echo "No notebooks in artefact; skipping."; exit 0; }
                          databricks workspace mkdirs "$(notebookWorkspaceRoot)"
                          databricks workspace import-dir --overwrite "$src" "$(notebookWorkspaceRoot)"

                - bash: |
                    set -euo pipefail
                    {
                      echo "## Redeploy to ${{ parameters.environment }}"
                      echo
                      echo "- Reason: ${{ parameters.reason }}"
                      echo "- Build: $(resources.pipeline.ci.runName) (commit $(resources.pipeline.ci.sourceCommit))"
                      echo "- Wheel: \`$(deployedWheel)\`"
                      echo "- Requested by: $(Build.RequestedFor)"
                    } > "$(Agent.TempDirectory)/redeploy-summary.md"
                    echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/redeploy-summary.md"
                  displayName: Record summary
