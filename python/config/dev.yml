# dataplatform configuration: dev
# Non-secret settings only. Secrets (tokens, connection strings) come from Key Vault
# via the Databricks secret scope or DefaultAzureCredential at runtime.
environment: dev
workspace_host: https://adb-0000000000000000.0.azuredatabricks.net
key_vault_name: kv-dataplatform-dev
catalog: dataplatform_dev

storage:
  account_name: stdataplatformdev
  containers:
    landing: landing
    bronze: bronze
    silver: silver
    gold: gold
    quarantine: quarantine
    checkpoints: checkpoints

job:
  shuffle_partitions: 16
  max_retries: 1
  timeout_minutes: 60
  delta_retention_hours: 168
  use_spot_instances: true
  min_workers: 1
  max_workers: 2
  cluster_policy_name: dataplatform-dev-jobs
  spark_version: 15.4.x-scala2.12
  node_type_id: Standard_D4ds_v5
