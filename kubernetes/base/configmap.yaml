apiVersion: v1
kind: ConfigMap
metadata:
  name: data-api-config
data:
  # Non-sensitive settings only. Anything secret comes from Key Vault through
  # the Secrets Store CSI driver (see secretproviderclass.yaml).
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  HTTP_PORT: "8080"
  METRICS_PORT: "9090"
  KEY_VAULT_NAME: kv-dp-data-dev-01
  STORAGE_ACCOUNT: stdpdatadev01
  STORAGE_CONTAINER: gold
  DATABRICKS_HOST: https://adb-0000000000000000.0.azuredatabricks.net
  UNITY_CATALOG: dp_data_dev
  REQUEST_TIMEOUT_SECONDS: "30"
