apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: data-api-keyvault
spec:
  provider: azure
  parameters:
    # Workload identity: no node-level identity, no pod identity, no secrets in
    # the manifest. The CSI driver exchanges the projected service account token
    # for a Key Vault token using the federated credential on the identity.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: 00000000-0000-0000-0000-000000000000
    tenantId: 00000000-0000-0000-0000-000000000000
    keyvaultName: kv-dp-data-dev-01
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: data-api-sql-connection-string
          objectType: secret
        - |
          objectName: data-api-databricks-token
          objectType: secret
        - |
          objectName: data-api-signing-key
          objectType: secret
  # Mirror the mounted files into a Kubernetes Secret so that they can also be
  # consumed as environment variables. The Secret only exists while a pod
  # mounts the volume.
  secretObjects:
    - secretName: data-api-secrets
      type: Opaque
      data:
        - objectName: data-api-sql-connection-string
          key: SQL_CONNECTION_STRING
        - objectName: data-api-databricks-token
          key: DATABRICKS_TOKEN
        - objectName: data-api-signing-key
          key: SIGNING_KEY
