apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-api
  annotations:
    # Client ID of the user-assigned managed identity federated with this
    # service account. Overlays replace the placeholder per environment.
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000000
  labels:
    azure.workload.identity/use: "true"
automountServiceAccountToken: true
