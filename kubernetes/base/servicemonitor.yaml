apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: data-api
  labels:
    # kube-prometheus-stack selects ServiceMonitors by this label by default.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: data-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
