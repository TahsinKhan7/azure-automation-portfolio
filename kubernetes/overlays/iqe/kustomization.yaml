apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# iqe overlay: only what differs from ../../base.
namespace: dataplatform-iqe

resources:
  - ../../base

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: iqe

images:
  - name: acrdataplatform.azurecr.io/dataplatform/data-api
    newTag: 1.4.0-rc.1

patches:
  - path: patch-configmap.yaml
  - path: patch-deployment.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: data-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: PodDisruptionBudget
      name: data-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: Ingress
      name: data-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.iqe.dataplatform.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.iqe.dataplatform.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target:
      kind: SecretProviderClass
      name: data-api-keyvault
    patch: |-
      - op: replace
        path: /spec/parameters/keyvaultName
        value: kv-dp-data-iqe-01
      - op: replace
        path: /spec/parameters/clientID
        value: 00000000-0000-0000-0000-00000000d003
  - target:
      kind: ServiceAccount
      name: data-api
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: 00000000-0000-0000-0000-00000000d003
